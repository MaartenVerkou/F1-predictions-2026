name: Deploy production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via MHV server
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Configure SSH
        shell: bash
        env:
          MHV_DEPLOY_HOST: ${{ secrets.MHV_DEPLOY_HOST }}
          MHV_DEPLOY_PORT: ${{ secrets.MHV_DEPLOY_PORT }}
          MHV_DEPLOY_USER: ${{ secrets.MHV_DEPLOY_USER }}
          MHV_DEPLOY_SSH_KEY: ${{ secrets.MHV_DEPLOY_SSH_KEY }}
          MHV_DEPLOY_KNOWN_HOSTS: ${{ secrets.MHV_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${MHV_DEPLOY_HOST:?Set MHV_DEPLOY_HOST repository secret.}"
          : "${MHV_DEPLOY_SSH_KEY:?Set MHV_DEPLOY_SSH_KEY repository secret.}"
          : "${MHV_DEPLOY_KNOWN_HOSTS:?Set MHV_DEPLOY_KNOWN_HOSTS repository secret.}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$MHV_DEPLOY_SSH_KEY" > ~/.ssh/mhv_deploy
          printf '%s\n' "$MHV_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/mhv_deploy ~/.ssh/known_hosts

          {
            echo "DEPLOY_HOST=$MHV_DEPLOY_HOST"
            echo "DEPLOY_PORT=${MHV_DEPLOY_PORT:-22}"
            echo "DEPLOY_USER=${MHV_DEPLOY_USER:-mhv-deploy}"
          } >> "$GITHUB_ENV"

      - name: Trigger production deploy
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$HOME/.ssh/mhv_deploy"
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts"
            -o ConnectTimeout=20
          )
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" deploy
